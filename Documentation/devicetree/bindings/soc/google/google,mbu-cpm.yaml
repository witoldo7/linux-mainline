%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/google/google,mbu-cpm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G6 Central Power Manager

maintainers:
  - Witold Olechowski <witusio@gmail.com>

description:
  The Central Power Manager (CPM) is a microcontroller in the Google Tensor
  G6 (malibu) SoC that owns most of its clocks, power domains and resets.
  The AP talks to it through two queued mailboxes of a Google MailBox Array,
  one for requests and one for responses and notifications.

  Clocks are identified by the id of their subsystem clock manager (LPCM)
  and their id within that LPCM, see
  include/dt-bindings/clock/google,mbu-cpm.h. Resets are identified the same
  way, see include/dt-bindings/reset/google,mbu-cpm.h. Power domains are
  listed in include/dt-bindings/power/google,mbu-power.h.

properties:
  compatible:
    const: google,mbu-cpm

  mboxes:
    items:
      - description: request mailbox
      - description: response and notification mailbox

  mbox-names:
    items:
      - const: tx
      - const: rx

  '#clock-cells':
    const: 2

  '#power-domain-cells':
    const: 1

  '#reset-cells':
    const: 2

  pmic-regulators:
    type: object
    additionalProperties: false
    description:
      Regulators of the DA9188 ("m") and DA9189 ("s") AP PMICs, which sit on
      a bus owned by the CPM.

    properties:
      compatible:
        const: google,mbu-pmic-regulators

      regulators:
        type: object
        additionalProperties: false

        patternProperties:
          '^(buck_([1-9]|1[0-3])|ldo_([1-9]|1[0-9]|2[0-8]))[ms]$':
            type: object
            $ref: /schemas/regulator/regulator.yaml#
            unevaluatedProperties: false

        properties:
          buck_boost:
            type: object
            $ref: /schemas/regulator/regulator.yaml#
            unevaluatedProperties: false

    required:
      - compatible
      - regulators

  gpio:
    type: object
    additionalProperties: false
    description: GPIOs of the DA9188 and DA9189 AP PMICs.

    properties:
      compatible:
        const: google,mbu-pmic-gpio

      gpio-controller: true

      '#gpio-cells':
        const: 2

      ngpios:
        maximum: 32

      gpio-line-names: true

    required:
      - compatible
      - gpio-controller
      - '#gpio-cells'
      - ngpios

required:
  - compatible
  - mboxes
  - mbox-names
  - '#clock-cells'
  - '#power-domain-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    power-management {
        compatible = "google,mbu-cpm";
        mboxes = <&cpm_req_mbox>, <&cpm_resp_mbox>;
        mbox-names = "tx", "rx";
        #clock-cells = <2>;
        #power-domain-cells = <1>;
        #reset-cells = <2>;

        pmic-regulators {
            compatible = "google,mbu-pmic-regulators";

            regulators {
                ldo_18s {
                    regulator-name = "ldo_18s";
                    regulator-min-microvolt = <1500000>;
                    regulator-max-microvolt = <3400000>;
                };
            };
        };

        gpio {
            compatible = "google,mbu-pmic-gpio";
            gpio-controller;
            #gpio-cells = <2>;
            ngpios = <19>;
        };
    };
