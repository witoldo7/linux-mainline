%YAML 1.2
---
$id: http://devicetree.org/schemas/display/google/google,mbu-dpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G6 display controller

maintainers:
  - Witold Olechowski <witusio@gmail.com>

description:
  The display processing unit of the Google Tensor G6 (malibu) SoC is a
  VeriSilicon DC9400. It fetches layers from memory, blends them and sends
  the result, optionally compressed with DSC, to the MIPI DSI hosts or the
  DisplayPort controller.

properties:
  compatible:
    const: google,mbu-dpu

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: Output 0 frame done
      - description: Output 0 underrun

  interrupt-names:
    items:
      - const: frame-done
      - const: underrun

  power-domains:
    minItems: 1
    maxItems: 4

  iommus:
    minItems: 1
    maxItems: 32

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Output 0, connected to the DSI0 host.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - power-domains
  - port

additionalProperties: false

examples:
  - |
    display-controller@f600000 {
        compatible = "google,mbu-dpu";
        reg = <0x0f600000 0x11f000>;
        interrupts-extended = <&dpu_multicast_aggr_1 5>,
                              <&dpu_multicast_aggr_1 6>;
        interrupt-names = "frame-done", "underrun";
        power-domains = <&cpm 5>, <&cpm 6>, <&cpm 8>;

        port {
            dpu_out_dsi0: endpoint {
                remote-endpoint = <&dsi0_in>;
            };
        };
    };
