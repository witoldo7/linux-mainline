%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/syna,s3908.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synaptics TouchComm Touchscreen Controllers

maintainers:
  - Vsevolod Nevorotov <sevanevorotov29@gmail.com>

description:
  Synaptics TouchComm generation-1 touchscreen controllers. The S3908 is
  connected over I2C. The controller of the Google Pixel 11 phones, whose part
  number is not known, is connected over SPI.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    enum:
      - syna,s3908
      - syna,tcm

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description: Core / digital power supply regulator (VDD)

  avdd-supply:
    description: Analog power supply regulator (AVDD)

  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vdd-supply
  - avdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@4b {
            compatible = "syna,s3908";
            reg = <0x4b>;
            interrupt-parent = <&tlmm>;
            interrupts = <23 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 22 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vreg_l3c_3p0>;
            avdd-supply = <&vreg_l8c_1p8>;
            wakeup-source;
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "syna,tcm";
            reg = <0>;
            spi-max-frequency = <19200000>;
            interrupt-parent = <&gpio>;
            interrupts = <12 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&pmic_gpio 17 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vreg_ts_vdd>;
            avdd-supply = <&vreg_ts_avdd>;
        };
    };
