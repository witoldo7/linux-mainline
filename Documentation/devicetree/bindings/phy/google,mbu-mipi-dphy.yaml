%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/google,mbu-mipi-dphy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G6 MIPI D-PHY

maintainers:
  - Witold Olechowski <witusio@gmail.com>

description:
  Synopsys DesignWare MIPI C/D-PHY TX (G301) instances used by the DSI
  outputs of the Google Tensor G6 (malibu) SoC, operated in D-PHY mode.

properties:
  compatible:
    const: google,mbu-mipi-dphy

  reg:
    items:
      - description: PHY core registers
      - description: PPI, reset and PLL control registers

  reg-names:
    items:
      - const: core
      - const: apb

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: pllref

  power-domains:
    maxItems: 1

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    phy@f7c0000 {
        compatible = "google,mbu-mipi-dphy";
        reg = <0x0f7c0000 0x18000>, <0x0f7d8800 0x800>;
        reg-names = "core", "apb";
        clocks = <&osc>;
        clock-names = "pllref";
        #phy-cells = <0>;
    };
